services:
  relay:
    image: ghcr.io/o34183901-gif/relay:${LICNO_CHANNEL:-stable}
    restart: unless-stopped
    environment:
      RELAY_SELF_URL: ${RELAY_SELF_URL}
      RELAY_PEERS: ${RELAY_PEERS:-}
      RELAY_TRUST_PROXY: "1"
      RELAY_GOSSIP_TOKEN: ${RELAY_GOSSIP_TOKEN:-}
      RELAY_METRICS_TOKEN: ${RELAY_METRICS_TOKEN:-}
      RELAY_MAX_QUEUE_BYTES: ${RELAY_MAX_QUEUE_BYTES:-8589934592}
      TURN_HOST: ${TURN_HOST}
      RELAY_EMBED_COTURN: "1"
    volumes:
      - relay-data:/data
    expose:
      - "8787"
    ports:
      - "3478:3478/udp"
      - "3478:3478/tcp"
      - "49160-49200:49160-49200/udp"
    security_opt:
      - no-new-privileges:true
    mem_limit: ${RELAY_MEM_LIMIT:-2g}
    pids_limit: ${RELAY_PIDS_LIMIT:-1024}

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    depends_on: [relay]
    ports:
      - "80:80"
      - "443:443"
    environment:
      RELAY_HOST: ${RELAY_HOST}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    cap_drop:
      - ALL
    cap_add:
      - NET_BIND_SERVICE
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
    mem_limit: 256m
    pids_limit: 256

volumes:
  relay-data:
  caddy-data:
  caddy-config:
